apiVersion: v1
kind: Pod
metadata:
  name: nginxpod
spec:
  containers:
    - name: nginxcontainer
      image: nginx:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: httpdpod
spec:
  containers:
    - name: httpdcont
      image: httpd:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: tomcatpod
spec:
  containers:
    - name: tomcatcont
      image: tomcat:latest
      ports:
        - containerPort: 8080
        
