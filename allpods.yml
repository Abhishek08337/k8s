apiVersion: v1
kind: Pod
metadata:
  name: nginxpod
  labels:
    app: nginx
spec:
  containers:
      name: nginxcontainer
      - image: nginx:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: httpdpod
  labels:
    app: httpd
spec:
  containers:
    - name: httpdcont
      image: httpd:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: tomcatpod
  labels:
    app: tomcat
spec:
  containers:
    - name: tomcatcont
      image: tomcat:latest
      ports:
        - containerPort: 8080
        
