apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginxdep
  labels:
    app: nginxhpa
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginxhpapodutoscaling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      name: nginxpod
      labels:
        app: nginxhpapodutoscaling
    spec:
      containers:
        - name: nginxcont
          image: nginx:latest
          ports:
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa
  labels:
    app: hpa
spec:
    scaleTargetRef:
      apiVersion: apps/v1
      kind: Deployment 
      name: nginxmypod
    minReplicas: 1
    maxReplicas: 2
    metrics:
      - type: Resource 
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 50