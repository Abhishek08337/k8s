apiVersion: v1
kind: Pod
metadata:
  name: tomcatpod
  labels:   
    app: tomcat
spec:
  containers:
    - name: tomcatcontainer
      image: tomcat:latest
      ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata: 
  name: tomcatsvc
spec:
  selector:
    app: tomcat
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
