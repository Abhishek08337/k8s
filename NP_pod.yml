apiVersion: v1
kind: Pod
metadata: 
  name: nginxpod
  labels: 
    app: nginx
spec: 
  containers:
    - name: nginxcont
      image: nginx:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: npsvc
spec: 
  selector:
    app: nginx
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
