apiVersion: v1
kind: Pod
metadata:
  name: httpdlb
  labels:
    app: httpd
spec:
  containers:
    - name: httpdcont
      image: httpd:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata: 
  name: lbsvc
spec:
  selector: 
    app: httpd
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
