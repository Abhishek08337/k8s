apiVersion: apps/v1 
kind: Deployment
metadata:
  name: nginxdep
  labels:
    type: dep 
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hpadep
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 
  template:
    metadata:
      name: nginxpod
      labels:
        app: hpadep
    spec:
      containers:
        - name: nginxcont
          image: nginx:latest
          ports:  
            - containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: myhpa
  labels:
    type: autohpdep
spec:
  scaleTargetRef:
    apiVersion: apps/v1 
    kind: Deployment
    name: nginxdep 
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource: 
        name: cpu 
        target: 
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory 
        target:
          type: Utilization
          averageUtilization: 75 
