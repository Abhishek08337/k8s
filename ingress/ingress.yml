apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: ing 
  labels:
    type: ingress 
spec:
  ingressClassName: nginx
  rules:
    - host: 
      http:
        paths: 
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cip
                port:
                  number: 80
          - path: /tomcat
            pathType: Prefix 
            backend:
              service:
                name: tccip
                port:
                  number: 8080
