apiVersion: v1
kind: Pod
metadata:
  name: nginxpod
  labels:   
    app: nginx
spec:
  containers:
    - name: nginxcontainer
      image: nginx:latest
      ports:
        - containerPort: 80
---
apiversion: v1
kind: Service
metadata:
  name: lbsvc
spec:
  selector: 
    app: nginx
  ports:
    - port: 80
      targetPort: 80
