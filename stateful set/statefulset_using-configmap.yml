apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stfset 
  labels:
    app: sset 
spec:
  replicas: 2
  selector:
    matchLabels: 
      app: dbstf1
  template:
    metadata:
      name: mysqlpod
      labels:
        app: sqlpod
    spec:
      containers:
        - name: mysqlpod 
          image: mysql:latest
          ports:
            - containerPort: 3306
          env: 
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: stfsdbkey-config
                  key: my_key