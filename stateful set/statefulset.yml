apiVersion: apps/v1
kind: StatefulSet
metadata: 
  name: sset
  labels: 
    app: mysqlsset 
spec:
  replicas: 3
  selector:
    matchLabels:
      app: mysqldbsset
  template:
    metadata:
      name: mysqlpod 
      labels:
        app: mysqldbsset
    spec:
      containers:
        - name: mysqlcont
          image: mysql:latest 
          ports:
            - containerPort: 80
              protocol: TCP 
          env:
            - name: MYSQL_ROOT_PASSWORD 
              value: "Abhi@1234"