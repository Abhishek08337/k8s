apiVersion: v1
kind: Pod
metadata:
  name: amazonpod
  namespace: dev
  labels:
    app: nginx
spec:
  containers:
    - name: nginxcontainer
      image: nginx:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginxcip
  namespace: dev
  labels:
    app: nginxcip
spec:
  selector:
    app: nginx
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: nginxnp
  namespace: dev
  labels:
    app: nginxnp
spec:
  selector:
    app: nginx
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata: 
  name: nginxlb
  namespace: dev
  labels:
    app: nginxlb
spec:
  selector:
    app: nginx
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP