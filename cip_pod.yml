apiVersion: v1
kind: Pod
metadata: 
  name: httpdpod
  labels:
    app: httpd
spec: 
  containers:
    - name: httpdcont
      image: httpd:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata: 
  name: httpdservice
spec:
  selector: 
    app: httpd
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
