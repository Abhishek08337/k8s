apiVersion: v1
kind: Pod
metadata:
  name: cipod
  labels:
    app: cipod
spec:
  containers:
    - name: cicont
      image: nginx:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ciservice
spec:
  selector:
    app: cipod
  type: ClusterIP
  ports: 
    - port: 80
      targetPort: 80
      protocol: TCP
